function nz(d,fr,ty,v){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=ty;f.frequency.value=fr;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t,Math.random(),d)}
const clash=()=>{nz(.12,3500,'highpass',.35);tone(1700+Math.random()*900,.16,'square',.07)},thud=()=>{nz(.1,300,'lowpass',.5);tone(120,.12,'sine',.3,50)},drum=()=>tone(90,.4,'sine',.7,38),chain=()=>{for(let i=0;i<4;i++)tone(2200+Math.random()*1800,.06,'triangle',.07,0,i*.06)};
function roar(p=.4){if(!cg)return;const t=AC.currentTime;cg.gain.cancelScheduledValues(t);cg.gain.setTargetAtTime(p,t,.05);cg.gain.setTargetAtTime(F?.22:0,t+.6,.5)}

const GUIDE=`<h3>📜 Hướng dẫn chơi</h3><p class="pr"><b>Mục tiêu:</b> xây một ludus (trại đấu sĩ) ở Capua, mua nô lệ, huấn luyện họ thành đấu sĩ huyền thoại, thắng các giải đấu và trả tự do cho người xứng đáng.</p><h3>1. Những bước đầu</h3><p class="pr">① Vào tab <b>Chợ nô lệ</b>, xem chỉ số, tiềm năng, bẩm sinh và mua một người.<br>② Chọn <b>nhánh hạng nhẹ</b> (nhanh, né) hoặc <b>hạng nặng</b> (bền, khỏe) cùng vũ khí khởi đầu.<br>③ Vào tab <b>Ludus</b>: xếp lịch tập, cho ăn, thưởng rượu.<br>④ Bấm <b>Kết thúc ngày</b> để thời gian trôi.<br>⑤ Vào <b>Đấu trường</b> chọn sàn đấu. Đấu sĩ tự chiến đấu, bạn chỉ xem.</p><h3>2. Chăm sóc nô lệ</h3><p class="pr">• Đói (từ 70) làm tập kém, sĩ khí tụt. Đói tối đa hoặc sĩ khí thấp có thể khiến họ nổi loạn hoặc bỏ trốn; kẻ trốn sẽ bị bắt lại và bạn quyết định xử lý.<br>• Bị thương: bấm <b>Gửi nhà điều trị</b>, mất 2–3 ngày, trong lúc đó người khác ra trận.<br>• Trung thành thấp quá có thể dẫn tới ám sát chủ.</p><h3>3. Nhánh, kỹ năng, trang bị</h3><p class="pr">• Hạng nhẹ chỉ dùng vũ khí và giáp nhẹ; hạng nặng chỉ dùng loại nặng. Mỗi nhánh có bộ kỹ năng riêng, mỗi kỹ năng học tối đa 3 cấp và cần vài ngày học.<br>• Giáp và vũ khí <b>không nâng cấp</b>, chỉ mua bộ mới bằng chất liệu tốt hơn (Đồng, Sắt, Thép, Vàng), ngoại hình đổi theo.<br>• Khu tập luyện nâng cấp dần mới có đủ dụng cụ; huấn luyện viên có chuyên môn riêng.</p><h3>4. Đấu trường và giải đấu</h3><p class="pr">• Đấu trường mở dần theo số trận thắng của đấu sĩ; mỗi nơi có địa hình bẫy riêng.<br>• Gia tộc gửi thư mời giải đấu (nhận hoặc từ chối, từ chối thì bị chê cười mất danh vọng). Hàng tháng có Đại Giải Capua và Giải Gia Tộc đồng đội 3v3. Đủ chiến công có thể dự Hỗn chiến các gia tộc.<br>• Gia tộc bạn chọn khi bắt đầu quyết định một lợi thế riêng.</p><h3>5. Sinh tử và tự do</h3><p class="pr">• Thua trận, khán đài và quý tộc bỏ phiếu sống chết. Bị chém đầu là chết ngay, không có phiếu bầu.<br>• Ai thua nhưng còn sống bị đày xuống <b>Sàn ngầm</b>: quay số bóc vũ khí và đấu với quái dị; thắng 6 trận thành Vua Sàn Ngầm.<br>• Khi giá trị cống hiến của nô lệ đầy, bạn trả tự do (Rudis) hoặc xin họ cống hiến tiếp.</p><h3>6. Ngày và đêm</h3><p class="pr">• Mỗi ngày có 3 buổi: <b>sáng</b> (mua bán, xếp lịch, chăm sóc), <b>chiều</b> (đấu trường mở cửa) và <b>tối</b> (giải trí, cho ăn, cho ngủ). Nô lệ có chỉ số buồn ngủ và buồn chán: ngủ thiếu hoặc chán thì tập kém và đánh yếu. Bấm nút đỏ để chuyển buổi.<br>• Mỗi đấu sĩ chỉ thi đấu được một trận mỗi ngày.</p><h3>7. Vũ khí và kỹ năng</h3><p class="pr">• Mỗi loại vũ khí có <b>bộ kỹ năng riêng</b>: Gladius có Phóng Kiếm, Đinh ba có Lưới Tử Thần, Scutum có Tường Khiên, Rìu có Bổ Đôi… Kỹ năng chỉ có tác dụng khi cầm đúng vũ khí.<br>• Nô lệ cao to vạm vỡ đắt hơn nhưng mạnh hơn. Tù binh Spartacus rất giỏi nhưng khó thuần phục.</p><h3>Mẹo</h3><p class="pr">Game tự lưu. Mua giáp trước khi dự giải lớn. Vào Cài đặt ở menu chính để tải tranh nền riêng.</p>`;
